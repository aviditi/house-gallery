services:
  - type: web
    name: property-snap
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PROXY_PROVIDER
        value: scraperapi
      # Set the actual key in the Render dashboard (kept out of git).
      - key: PROXY_API_KEY
        sync: false
      # Signs share tokens. Render generates this once and keeps it across
      # deploys, so links minted today still verify after the next push.
      - key: PREFS_SECRET
        generateValue: true
