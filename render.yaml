services:
  - type: web
    name: property-snap
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PROXY_PROVIDER
        value: scraperapi
      # Set the actual key in the Render dashboard (kept out of git).
      - key: PROXY_API_KEY
        sync: false
